name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Verify opening data artifacts
        run: |
          npm run openings:refresh
          git diff --exit-code lib/data/openings/partitions/lichess-named-openings.json public/data/openings/fen-index.generated.json || (
            echo "::error::Opening JSON/FEN index out of date. Run: npm run openings:refresh"
            exit 1
          )
      - run: npm test
      - name: Verify web ↔ Android parity contract
        run: |
          npm run parity:export
          if [ -n "$(git status --porcelain -- parity/)" ]; then
            git status --short -- parity/
            echo "::error::Parity contract out of date. Run: npm run parity:export and commit parity/"
            exit 1
          fi
      - name: Verify ChessAvatar WASM bundle
        run: |
          npm run verify:chessavatar
          npm run smoke:chessavatar
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # Once main is green, tell the Android repo that the parity contract changed
  # (its parity-sync workflow opens a PR with the new constants, data and vectors).
  notify-android:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      ANDROID_REPO_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          base: ${{ github.event.before }}
          filters: |
            parity:
              - 'parity/**'
      - name: Dispatch parity-updated to ChessAvatarAndroid
        if: steps.changes.outputs.parity == 'true' && env.ANDROID_REPO_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ANDROID_REPO_TOKEN }}
          repository: barbarom84-ai/ChessAvatarAndroid
          event-type: parity-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
      - name: Missing ANDROID_REPO_TOKEN
        if: steps.changes.outputs.parity == 'true' && env.ANDROID_REPO_TOKEN == ''
        run: echo "::warning::parity/ changed but ANDROID_REPO_TOKEN is not set; the Android daily parity-sync will pick it up."
